# ZiOT 生产 EMQX 配置（整文件替换 /opt/emqx/etc/emqx.conf）。
# 注意：EMQX 5.10 不会自动加载 etc/conf.d/，必须写进 emqx.conf（优先级高于 base.hocon）。
# node.name 行保持原样，docker entrypoint 会按 EMQX_NAME/EMQX_HOST 环境变量改写它。

node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
  listeners {
    http.bind = 18083
  }
}

# 设备 MQTT：明文 1883
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 500
}

# 设备 MQTT over TLS：8883（Let's Encrypt 证书，deploy/sync-certs.sh 同步）
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 500
  ssl_options {
    certfile = "/etc/emqx/certs/fullchain.pem"
    keyfile = "/etc/emqx/certs/privkey.pem"
    cacertfile = "/etc/emqx/certs/chain.pem"
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}

retainer.enable = false
delayed.enable = false

mqtt.max_packet_size = 1MB
mqtt.max_clientid_len = 128

# 设备认证：HTTP 回调 web 服务
authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://web:3000/api/internal/emqx/auth"
    headers {
      "content-type" = "application/json"
      "x-request-source" = "emqx"
    }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
  }
]

# 设备 ACL：HTTP 回调 web 服务
authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = http
      method = post
      url = "http://web:3000/api/internal/emqx/acl"
      headers {
        "content-type" = "application/json"
        "x-request-source" = "emqx"
      }
      body {
        username = "${username}"
        clientid = "${clientid}"
        action = "${action}"
        topic = "${topic}"
        qos = "${qos}"
        retain = "${retain}"
      }
    }
  ]
}
