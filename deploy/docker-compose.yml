services:
  postgres:
    image: postgres:16-alpine
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_DB: ziot
      POSTGRES_USER: ziot
      POSTGRES_PASSWORD: ziot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./lightweight/postgres.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziot -d ziot"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &default-logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 768M

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./lightweight/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 384M

  emqx:
    image: emqx/emqx:5.10
    environment:
      EMQX_NAME: ziot-emqx
      EMQX_HOST: emqx
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public123
      ZIOT_EMQX_AUTH_URL: http://web:3000/api/internal/emqx/auth
      ZIOT_EMQX_ACL_URL: http://web:3000/api/internal/emqx/acl
      ZIOT_EMQX_WEBHOOK_URL: http://web:3000/api/internal/emqx/webhook
    ports:
      - "1883:1883"
      - "127.0.0.1:18083:18083"
    volumes:
      - ./emqx/dev.conf:/opt/emqx/etc/conf.d/ziot.conf:ro
      - ./lightweight/emqx.conf:/opt/emqx/etc/conf.d/lightweight.conf:ro
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 768M

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ziot
      MINIO_ROOT_PASSWORD: ziot-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 512M

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm --filter @ziot/web dev"
    environment:
      DATABASE_URL: postgresql://ziot:ziot@postgres:5432/ziot
      REDIS_URL: redis://redis:6379
      EMQX_API_URL: http://emqx:18083
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_BUCKET: ziot-firmwares
      MINIO_ACCESS_KEY: ziot
      MINIO_SECRET_KEY: ziot-secret
      JWT_SECRET: local-development-secret-change-before-production
      PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1024M

  worker:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm --filter @ziot/worker dev"
    environment:
      DATABASE_URL: postgresql://ziot:ziot@postgres:5432/ziot
      REDIS_URL: redis://redis:6379
      EMQX_API_URL: http://emqx:18083
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_BUCKET: ziot-firmwares
      MINIO_ACCESS_KEY: ziot
      MINIO_SECRET_KEY: ziot-secret
      JWT_SECRET: local-development-secret-change-before-production
      PUBLIC_APP_URL: http://localhost:3000
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -v grep | grep -q 'tsx watch src/index.ts'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 512M

volumes:
  postgres-data:
  minio-data:
