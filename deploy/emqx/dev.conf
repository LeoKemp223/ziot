# Development callback endpoints used by the local Docker Compose network.
# EMQX can reach the Next.js app by the Compose service name `web`.

authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://web:3000/api/internal/emqx/auth"
    headers {
      "content-type" = "application/json"
      "x-request-source" = "emqx"
    }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
  }
]

authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = http
      method = post
      url = "http://web:3000/api/internal/emqx/acl"
      headers {
        "content-type" = "application/json"
        "x-request-source" = "emqx"
      }
      body {
        username = "${username}"
        clientid = "${clientid}"
        action = "${action}"
        topic = "${topic}"
        qos = "${qos}"
        retain = "${retain}"
      }
    }
  ]
}
