listen_addresses = '*'
port = 5432

max_connections = 30
shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 128MB
effective_cache_size = 1536MB

wal_level = replica
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9

log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
